aid: rosebud-ai
name: Rosebud AI
description: >-
  Rosebud AI is an AI-powered game creation platform that lets anyone build and
  deploy playable 3D games and interactive worlds from natural-language prompts,
  a workflow the company calls "Vibe Coding" — you describe scenes, rules, and
  behaviors and an AI assistant named "Rosie" writes and applies the underlying
  JavaScript. The platform runs on a custom engine designed for AI-era game
  development, featuring deterministic WASM-based physics, native real-time
  multiplayer, instant link-based sharing, and a built-in "Juice API" for camera
  effects, particle systems, and spatial audio. Founded in 2019 in San Francisco
  by CEO Lisha Li (Ph.D. in machine learning, UC Berkeley), Rosebud AI is backed
  by a16z. As of this enrichment pass the company ships a hosted consumer product
  and publishes no public developer API, OpenAPI/AsyncAPI specification, SDK
  packages, MCP server, or developer portal.
